name: GoReleaser

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  goreleaser:
    permissions:
      contents: write
    uses: matt-riley/matt-riley-ci/.github/workflows/go-goreleaser.yml@0a310f1286537ed4fd000af4b35cd6459b00448d # v4
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      homebrew-tap-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}
