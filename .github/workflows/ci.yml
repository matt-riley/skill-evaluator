name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:ci
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@c956b4c8237a0b1d733735d48a3724edde629717 # v4
    with:
      test: true
      lint: true
      vet: true
      fmt: true

  govulncheck:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:govulncheck
      cancel-in-progress: true
    needs: ci
    if: ${{ always() }}
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@c956b4c8237a0b1d733735d48a3724edde629717 # v4
