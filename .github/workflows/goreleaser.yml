name: GoReleaser

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  goreleaser:
    permissions:
      contents: write
    uses: matt-riley/matt-riley-ci/.github/workflows/go-goreleaser.yml@f846763f763247cb0140e3dd08002280b001f6cf # v4
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      homebrew-tap-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}
